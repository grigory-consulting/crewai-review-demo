  "mcp>=1.28,<2",
  "openai>=2.50,<3",
  "pydantic>=2.12,<3",
  "python-dotenv>=1.2,<2",
  "httpx>=0.28,<1",
  "jupyter>=1.1",
  "ipykernel>=7.0",
  "nbformat>=5.10",
]
