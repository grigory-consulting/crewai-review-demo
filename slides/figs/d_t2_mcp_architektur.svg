  <title id="d_t2_mcp_architektur-title">MCP: Host, Client, Server</title>
  <desc id="d_t2_mcp_architektur-desc">Die CrewAI-Anwendung ist der Host; ihr MCP-Client spricht per JSON-RPC über stdio mit einem lokalen Git-Server und über HTTP mit dem GitHub-MCP-Server; beide Server bieten Tools, Resources und Prompts.</desc>
